<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - File Share</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <div class="auth-container" data-testid="auth-container">
        <div class="auth-header" data-testid="auth-header">
            <h1 id="pageTitle" data-testid="page-title">{{ 'Регистрация' if is_register else 'Вход' }}</h1>
        </div>

        <div id="errorMessage" data-testid="error-message" class="error-msg {% if error %}visible{% endif %}">
            {% if error %}{{ error }}{% endif %}
        </div>

        <form method="POST" action="/login" data-testid="auth-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Скрытое поле режима -->
            <input type="hidden" name="register" id="registerMode" value="{{ '1' if is_register else '0' }}"
                data-testid="register-mode-input">

            <div class="form-group" data-testid="username-form-group">
                <label class="form-label" data-testid="username-label">Имя пользователя</label>
                <input type="text" data-testid="username-input" name="username" class="form-input" required
                    autocomplete="username" value="{{ username or '' }}">
                <div class="field-error" id="usernameError"></div>
            </div>

            <div class="form-group" data-testid="password-form-group">
                <label class="form-label" data-testid="password-label">Пароль</label>
                <input type="password" data-testid="password-input" name="password" class="form-input"
                    autocomplete="{{ 'new-password' if is_register else 'current-password' }}"
                    value="{{ password or '' }}">
                <div class="field-error" id="passwordError"></div>
            </div>

            <div class="form-group" data-testid="password-confirm-form-group" id="passwordConfirmGroup"
                style="display: {{ 'block' if is_register else 'none' }};">
                <label class="form-label" data-testid="password-confirm-label">Подтверждение пароля</label>
                <input type="password" data-testid="password-confirm-input" name="password_confirm" class="form-input"
                    autocomplete="new-password" value="{{ password_confirm or '' }}">
                <div class="field-error" id="passwordConfirmError"></div>
            </div>

            <div class="form-group" data-testid="invite-code-form-group" id="inviteCodeGroup"
                style="display: {{ 'block' if is_register else 'none' }};">
                <label class="form-label" data-testid="invite-code-label">Код приглашения</label>
                <input type="text" data-testid="invite-code-input" name="invite_code" class="form-input"
                    autocomplete="off" value="{{ invite_code or '' }}">
                <div class="field-error" id="inviteCodeError"></div>
            </div>

            <button type="submit" data-testid="submit-btn" class="btn-submit" id="submitBtn">{{ 'Зарегистрироваться' if
                is_register else 'Войти' }}</button>
        </form>

        <div class="auth-switch" data-testid="auth-switch">
            <span id="switchText" data-testid="switch-text">{{ 'Уже есть аккаунт?' if is_register else 'Нет аккаунта?'
                }}</span>
            <a class="auth-link" id="toggleLink" data-testid="toggle-link">{{ 'Войти' if is_register else
                'Зарегистрироваться' }}</a>
        </div>

        <a href="https://mk5d.ru" class="back-home" data-testid="back-home-link">← Вернуться на главную</a>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
