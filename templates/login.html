<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - File Share</title>
    <!-- Подключаем основные стили (если там есть переменные цветов) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Подключаем специфичные стили для авторизации -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    
    <!-- CSRF Token Meta Tag -->
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token else '' }}">
</head>

<body>
    <div class="auth-container" data-testid="auth-container">
        <div class="auth-header" data-testid="auth-header">
            <h1 id="pageTitle" data-testid="page-title">Вход</h1>
        </div>

        <!-- Блок ошибки. Если сервер вернул error, показываем его -->
        <div id="errorMessage" data-testid='error-message' class="error-msg {% if error %}visible{% endif %}">
            {% if error %}{{ error }}{% endif %}
        </div>

        <!-- Форма всегда отправляет на /login -->
        <form method="POST" action="/login" data-testid="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- CSRF Token для формы -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}"/>
            
            <!-- Скрытое поле для режима. 0 = вход, 1 = регистрация -->
            <input type="hidden" name="register" id="registerMode" value="0" data-testid="register-mode-input">

            <div class="form-group" data-testid="username-form-group">
                <label class="form-label" data-testid="username-label">Имя пользователя</label>
                <input type="text" data-testid='username-input' name="username" class="form-input" required autocomplete="username">
            </div>
            
            <div class="form-group" data-testid="password-form-group">
                <label class="form-label" data-testid="password-label">Пароль</label>
                <input type="password" data-testid='password-input' name="password" class="form-input" required autocomplete="current-password">
            </div>

            <button type="submit" data-testid='submit-btn' class="btn-submit" id="submitBtn">Войти</button>
        </form>

        <div class="auth-switch" data-testid="auth-switch">
            <span id="switchText" data-testid="switch-text">Нет аккаунта?</span>
            <a class="auth-link" id="toggleLink" data-testid="toggle-link">Зарегистрироваться</a>
        </div>
        
        <a href="/" class="back-home" data-testid="back-home-link">← Вернуться на главную</a>
    </div>

    <!-- Подключаем скрипт авторизации -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
