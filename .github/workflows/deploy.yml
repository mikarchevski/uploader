name: Uploader CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Глобальные переменные для избежания дублирования
env:
  PYTHON_VERSION: "3.11"

jobs:
  # ══════════════════════════════════════════════════════════
  # 1. СТАТИЧЕСКИЙ АНАЛИЗ (Быстро, параллельно, на каждом PR)
  # ═══════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Compile check
        run: python -m compileall -q app.py backend check_config.py

  # ═══════════════════════════════════════════════════════════
  # 2. ДЕПЛОЙ (Только для main, только если lint/compile прошли)
  # ═══════════════════════════════════════════════════════════
  deploy:
    needs: [lint, compile-check]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH config (disable host key checking)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
              ServerAliveInterval 60
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Create Backup
        run: |
          ssh ${{ secrets.PROD_HOST }} '
            echo "📦 Creating backup before deploy..."
            mkdir -p /opt/uploader/.bak && 
            rsync -a --delete --exclude=".bak" /opt/uploader/ /opt/uploader/.bak/
            echo "✅ Backup created at /opt/uploader/.bak"
          '

      - name: Sync code to prod
        run: |
          rsync -az --delete --timeout=60 \
            --exclude '.git' \
            --exclude 'venv/' \
            --exclude 'uploads/' \
            --exclude 'flask_sessions/' \
            --exclude 'data/' \
            --exclude '*.db' \
            --exclude '*.log' \
            --exclude '.env' \
            --exclude '__pycache__/' \
            --exclude '.bak/' \
            ./ ${{ secrets.PROD_HOST }}:/opt/uploader/

      - name: Update dependencies
        run: |
          ssh ${{ secrets.PROD_HOST }} '
            cd /opt/uploader &&
            python3 -m venv venv &&
            source venv/bin/activate &&
            pip install --upgrade pip -q &&
            pip install -q -r requirements.txt
          '

      - name: Restart service
        run: |
          ssh ${{ secrets.PROD_HOST }} '
            sudo systemctl restart uploader &&
            sleep 3 &&
            systemctl is-active --quiet uploader
          '

      - name: Basic Smoke Test
        run: |
          curl -sf ${{ vars.PROD_URL }}/login -o /tmp/login.html || { 
            echo "❌ Smoke test failed: /login"
            curl -s ${{ vars.PROD_URL }}/login | head -50
            exit 1 
          }
          curl -sf ${{ vars.PROD_URL }}/ -o /tmp/index.html || { 
            echo "❌ Smoke test failed: /"
            curl -s ${{ vars.PROD_URL }}/ | head -50
            exit 1 
          }
          echo "✅ Basic smoke test passed"

  # ═══════════════════════════════════════════════════════════
  # 3. E2E ТЕСТЫ (Проверяем реальный продакшн после деплоя)
  # ══════════════════════════════════════════════════════════
  e2e:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      APP_URL: ${{ vars.PROD_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    
    steps:
      - name: Checkout QA tests repo
        uses: actions/checkout@v4
        with:
          repository: mikarchevski/qa-tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        run: pytest -v --alluredir=allure-results --browser=chromium

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # 4. АВТОМАТИЧЕСКИЙ ОТКАТ (Только если E2E упали)
  # ══════════════════════════════════════════════════════════
  rollback:
    needs: [deploy, e2e]
    if: needs.e2e.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Setup SSH config (disable host key checking)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
              ServerAliveInterval 60
              ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Restore Backup
        run: |
          ssh ${{ secrets.PROD_HOST }} '
            echo "⚠️ E2E TESTS FAILED! Initiating automatic rollback..."
            if [ ! -d /opt/uploader/.bak ] || [ -z "$(ls -A /opt/uploader/.bak)" ]; then
              echo "❌ Backup is missing or empty! Cannot rollback."
              exit 1
            fi
            rsync -az --delete /opt/uploader/.bak/ /opt/uploader/
            sudo systemctl restart uploader
            echo "✅ Rollback completed. Production restored to previous state."
          '
      
      - name: Notify about rollback
        run: |
          echo "⚠️ Автоматический откат был выполнен из-за падения E2E тестов."
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
