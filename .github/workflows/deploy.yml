name: uploader  CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app.py backend check_config.py

  deploy:
    needs: test
    runs-on: self-hosted
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to prod
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'venv/' \
            --exclude 'uploads/' \
            --exclude 'flask_sessions/' \
            --exclude 'data/' \
            --exclude '*.db' \
            --exclude '*.log' \
            --exclude '.env' \
            --exclude '__pycache__/' \
            ./ ${{ secrets.PROD_HOST }}:/opt/uploader/

      - name: Update dependencies on prod
        run: ssh ${{ secrets.PROD_HOST }} 'pip3 install --break-system-packages -q -r /opt/uploader/requirements.txt'

      - name: Restart service
        run: ssh ${{ secrets.PROD_HOST }} 'sudo systemctl restart uploader && sleep 2 && systemctl is-active uploader'

      - name: Smoke test
        run: |
          curl -sf ${{ secrets.PROD_URL }}/login -o /dev/null
          echo "DEPLOY OK"
