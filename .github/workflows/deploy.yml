name: uploader  CI/CD

on:
  push:
    branches: [main]

env:
  PROD_HOST: benx@192.168.1.146
  PROD_URL: httpS://disk.mk5d.ru

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app.py backend check_config.py


  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      APP_URL: https://benx-share.duckdns.org
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v4
        with:
          repository: mikarchevski/qa-tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        run: pytest -v --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to prod
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'venv/' \
            --exclude 'uploads/' \
            --exclude 'flask_sessions/' \
            --exclude 'data/' \
            --exclude '*.db' \
            --exclude '*.log' \
            --exclude '.env' \
            --exclude '__pycache__/' \
            ./ ${{ env.PROD_HOST }}:/opt/uploader/

      - name: Update dependencies on prod
        run: ssh ${{ env.PROD_HOST }} 'pip3 install --break-system-packages -q -r /opt/uploader/requirements.txt'

      - name: Restart service
        run: ssh ${{ env.PROD_HOST }} 'sudo systemctl restart uploader && sleep 2 && systemctl is-active uploader'

      - name: Smoke test
        run: |
          curl -sf ${{ env.PROD_URL }}/login -o /dev/null
          echo "DEPLOY OK"
